<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1358" viewBox="0 0 960 1358" role="img" aria-labelledby="title desc">
<title id="title">Marque-page brodé Vietnam du Nord, tutoriel illustré</title><desc id="desc">Patron, matériels, motif de losanges en fil rouge blanc et jaune, étapes de couture et coupe du marque-page.</desc>
<rect width="960" height="1358" fill="#faf4e8"/><g fill="#35583f" font-family="Georgia,serif"><text x="480" y="68" font-size="43" text-anchor="middle">Marque-page brodé · Vietnam du Nord</text><text x="480" y="107" font-style="italic" font-size="23" text-anchor="middle">Création originale inspirée des broderies des montagnes du Nord</text></g>
<path d="M30 123 H930" stroke="#af6f50" stroke-dasharray="9 7" stroke-width="2"/>
<rect x="40" y="146" width="315" height="620" rx="18" fill="#f4e8d8" stroke="#d2c0a7"/>
<text x="197" y="186" fill="#385b42" text-anchor="middle" font-family="Georgia" font-size="28">Le marque-page terminé</text>
<rect x="127" y="210" width="140" height="500" rx="7" fill="#283f65" stroke="#122c48" stroke-width="5"/>
<rect x="144" y="228" width="106" height="462" rx="3" fill="none" stroke="#f3e9d4" stroke-width="3" stroke-dasharray="10 9"/>
<g stroke-width="7" fill="none"><path d="M197 291 L250 359 L197 427 L144 359 Z" stroke="#f4e7dc"/><path d="M197 307 L235 359 L197 411 L159 359 Z" stroke="#c85750"/><path d="M197 465 L250 533 L197 601 L144 533 Z" stroke="#f4e7dc"/><path d="M197 481 L235 533 L197 585 L159 533 Z" stroke="#c85750"/></g>
<g stroke="#edc44f" stroke-width="7" stroke-linecap="round"><path d="M181 359 H213 M197 343 V375 M181 533 H213 M197 517 V549"/></g>
<g stroke="#e9e5d8" stroke-width="4"><path d="M158 260 l-9 9 m9 -9 l9 9 M236 260 l-9 9 m9 -9 l9 9 M156 644 l-9 9 m9 -9 l9 9 M237 644 l-9 9 m9 -9 l9 9"/></g>
<text x="197" y="742" font-size="21" text-anchor="middle" fill="#36583e">Format fini : environ 5 × 17 cm</text>
<rect x="382" y="146" width="539" height="248" rx="18" fill="#fffaf2" stroke="#d2c0a7"/>
<text x="411" y="196" fill="#36583e" font-family="Georgia" font-size="30">1. Fiche projet</text>
<g font-family="Arial,sans-serif" font-size="22" fill="#34463e"><text x="411" y="236">Niveau : débutant</text><text x="411" y="277">Durée : 1 h 30 à 2 h</text><text x="411" y="318">Technique : point arrière et point de croix</text><text x="411" y="359">Ambiance : indigo, blanc, rouge, jaune</text></g>
<rect x="382" y="411" width="539" height="355" rx="18" fill="#fffaf2" stroke="#d2c0a7"/>
<text x="411" y="457" fill="#36583e" font-family="Georgia" font-size="30">2. Fournitures pour un ouvrage</text>
<g font-family="Arial,sans-serif" fill="#34463e" font-size="21"><text x="411" y="505">• 2 rectangles coton indigo : 7 × 19 cm</text><text x="411" y="550">• H630 facultatif : 5 × 17 cm</text><text x="411" y="595">• Mouliné blanc, rouge et jaune</text><text x="411" y="640">• Fil à coudre, aiguille et épingles</text><text x="411" y="685">• Crayon textile, ciseaux et fer</text><text x="411" y="728">• Marges de 1 cm comprises</text></g>
<rect x="40" y="792" width="881" height="209" rx="18" fill="#fffaf2" stroke="#d2c0a7"/>
<text x="71" y="839" fill="#36583e" font-family="Georgia" font-size="29">3. Coupe et motif</text>
<rect x="85" y="865" width="75" height="111" rx="2" fill="#283f65"/><rect x="96" y="876" width="53" height="89" fill="none" stroke="#fff2dd" stroke-dasharray="5 4" stroke-width="2"/><text x="172" y="902" fill="#35483e" font-size="20">Couper 2 fois 7 × 19 cm</text><text x="172" y="934" fill="#35483e" font-size="20">Broder les 2 losanges avant assemblage</text><text x="172" y="965" fill="#35483e" font-size="20">Laisser 1 cm libre sur les bords</text>
<rect x="40" y="1022" width="881" height="289" rx="18" fill="#fffaf2" stroke="#d2c0a7"/>
<text x="71" y="1068" fill="#36583e" font-family="Georgia" font-size="30">4. Réalisation pas à pas</text>
<g font-family="Arial" font-size="21" fill="#34463e"><text x="75" y="1115">1. Tracer le motif et broder le rectangle de devant.</text><text x="75" y="1154">2. Fixer le H630 sur l’envers (facultatif).</text><text x="75" y="1193">3. Superposer endroit contre endroit et piquer à 1 cm.</text><text x="75" y="1232">4. Laisser une ouverture de 4 cm sur un grand côté.</text><text x="75" y="1271">5. Dégarnir, retourner, repasser puis surpiquer.</text></g>
<text x="480" y="1338" fill="#786b59" font-family="Georgia" font-style="italic" font-size="17" text-anchor="middle">Une interprétation contemporaine, et non la reproduction d’un motif traditionnel identifié.</text></svg>
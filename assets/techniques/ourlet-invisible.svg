<rect x="30" y="476" width="1140" height="42" rx="11" fill="#467d77" stroke="#467d77" stroke-width="2"/><text x="600" y="506" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">LES ÉTAPES PAS À PAS</text><rect x="31" y="510" width="181" height="320" rx="14" fill="#fffdf8" stroke="#d2c8ba" stroke-width="2"/><rect x="42" y="520" width="34" height="34" rx="18" fill="#845c48" stroke="#845c48" stroke-width="2"/><text x="59" y="545" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="43" y="580" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">Surfiler</text><text x="43" y="605" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">si nécessaire</text><rect x="46" y="619" width="151" height="90" rx="8" fill="#d7e9e8" stroke="#c8d3cc" stroke-width="2"/><path d="M54 670l17 -12 17 12 17 -12 17 12 17 -12 17 12" fill="none" stroke="#517a8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="753" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">Éviter que le bord</text><text x="44" y="782" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">brut s'effiloche.</text><rect x="222" y="510" width="181" height="320" rx="14" fill="#fffdf8" stroke="#d2c8ba" stroke-width="2"/><rect x="233" y="520" width="34" height="34" rx="18" fill="#845c48" stroke="#845c48" stroke-width="2"/><text x="250" y="545" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="234" y="580" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">Marquer</text><text x="234" y="605" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">et repasser</text><rect x="237" y="619" width="151" height="90" rx="8" fill="#f2e6dc" stroke="#c8d3cc" stroke-width="2"/><path d="M245 667h134m-99 -5v-40m-7 8l7 -8 7 8" fill="none" stroke="#ba796d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="235" y="753" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">Mesurer l'ourlet ;</text><text x="235" y="782" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">replier vers l'envers.</text><rect x="413" y="510" width="181" height="320" rx="14" fill="#fffdf8" stroke="#d2c8ba" stroke-width="2"/><rect x="424" y="520" width="34" height="34" rx="18" fill="#845c48" stroke="#845c48" stroke-width="2"/><text x="441" y="545" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="425" y="580" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">Former le pli</text><text x="425" y="605" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">en accordéon</text><rect x="428" y="619" width="151" height="90" rx="8" fill="#d7e9e8" stroke="#c8d3cc" stroke-width="2"/><path d="M436 670q30 -64 62 -5q30 36 70 -5" fill="none" stroke="#517a8c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="426" y="753" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">Replier le tissu</text><text x="426" y="782" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">pour présenter le pli.</text><rect x="604" y="510" width="181" height="320" rx="14" fill="#fffdf8" stroke="#d2c8ba" stroke-width="2"/><rect x="615" y="520" width="34" height="34" rx="18" fill="#845c48" stroke="#845c48" stroke-width="2"/><text x="632" y="545" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="616" y="580" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">Placer sous</text><text x="616" y="605" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">le pied G</text><rect x="619" y="619" width="151" height="90" rx="8" fill="#f2e6dc" stroke="#c8d3cc" stroke-width="2"/><rect x="650" y="603" width="84" height="62" rx="6" fill="#dbe7e7" stroke="#647c84" stroke-width="2"/><text x="690" y="646" font-family="Georgia,serif" font-size="31" font-weight="bold" fill="#4a656b" text-anchor="middle">G</text><text x="617" y="753" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">Guider le pli</text><text x="617" y="782" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">contre le pied.</text><rect x="795" y="510" width="181" height="320" rx="14" fill="#fffdf8" stroke="#d2c8ba" stroke-width="2"/><rect x="806" y="520" width="34" height="34" rx="18" fill="#845c48" stroke="#845c48" stroke-width="2"/><text x="823" y="545" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="807" y="580" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">Coudre</text><text x="807" y="605" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">lentement</text><rect x="810" y="619" width="151" height="90" rx="8" fill="#d7e9e8" stroke="#c8d3cc" stroke-width="2"/><path d="M873 595v78m-25 -16h67" fill="none" stroke="#49646b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="873" cy="659" r="6" fill="#cc7467"/><text x="808" y="753" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">La pointe à gauche</text><text x="808" y="782" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">saisit 1 à 2 fils.</text><rect x="986" y="510" width="181" height="320" rx="14" fill="#fffdf8" stroke="#d2c8ba" stroke-width="2"/><rect x="997" y="520" width="34" height="34" rx="18" fill="#845c48" stroke="#845c48" stroke-width="2"/><text x="1014" y="545" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="998" y="580" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">Déplier</text><text x="998" y="605" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#263f50" text-anchor="start">et repasser</text><rect x="1001" y="619" width="151" height="90" rx="8" fill="#f2e6dc" stroke="#c8d3cc" stroke-width="2"/><path d="M1009 647h132" fill="none" stroke="#688e98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 10"/><text x="999" y="753" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">Les points restent</text><text x="999" y="782" font-family="Georgia,serif" font-size="19" font-weight="normal" fill="#30484b" text-anchor="start">quasi invisibles.</text>

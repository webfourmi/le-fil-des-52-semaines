<rect x="30" y="1209" width="553" height="178" rx="18" fill="#eef7ec" stroke="#a9bea4" stroke-width="2"/><text x="56" y="1253" font-family="Georgia,serif" font-size="27" font-weight="bold" fill="#426e50" text-anchor="start">✓ AVANTAGES</text><text x="56" y="1291" font-family="Georgia,serif" font-size="21" font-weight="normal" fill="#30484b" text-anchor="start">• Finition discrète et soignée.</text><text x="56" y="1319" font-family="Georgia,serif" font-size="21" font-weight="normal" fill="#30484b" text-anchor="start">• Convient aux vêtements habillés.</text><text x="56" y="1347" font-family="Georgia,serif" font-size="21" font-weight="normal" fill="#30484b" text-anchor="start">• Solide sur de nombreux tissus.</text>
<rect x="599" y="1209" width="571" height="178" rx="18" fill="#faefec" stroke="#d7aaa5" stroke-width="2"/><text x="626" y="1253" font-family="Georgia,serif" font-size="27" font-weight="bold" fill="#9c5553" text-anchor="start">× LIMITES</text><text x="626" y="1291" font-family="Georgia,serif" font-size="21" font-weight="normal" fill="#30484b" text-anchor="start">• Pliage et guidage précis.</text><text x="626" y="1319" font-family="Georgia,serif" font-size="21" font-weight="normal" fill="#30484b" text-anchor="start">• Points visibles si le pli est trop pris.</text><text x="626" y="1347" font-family="Georgia,serif" font-size="21" font-weight="normal" fill="#30484b" text-anchor="start">• Délicat sur les tissus très épais.</text>
<rect x="30" y="1403" width="1140" height="119" rx="17" fill="#e7f1f3" stroke="#9bb5bc" stroke-width="2"/><text x="56" y="1445" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#385d6a" text-anchor="start">DÉPANNAGE ET CONSEIL</text><text x="57" y="1477" font-family="Georgia,serif" font-size="20" font-weight="normal" fill="#30484b" text-anchor="start">Points visibles : éloigner un peu le pli du passage de l’aiguille.</text><text x="57" y="1505" font-family="Georgia,serif" font-size="20" font-weight="normal" fill="#30484b" text-anchor="start">Ourlet qui se défait : augmenter très légèrement la prise du pli. Toujours tester sur une chute.</text>

<text x="10" y="11" font-family="Arial" font-size="5" font-weight="bold" fill="#263c32">KAN THA · ÉTUI À LUNETTES — PATRON A4</text>
<text x="10" y="17" font-family="Arial" font-size="3.5">Imprimer à 100 %, sans ajuster · Marges de 1 cm comprises</text>
<rect x="10" y="27" width="120" height="180" fill="#fbf8f1" stroke="#263c32" stroke-width=".6"/>
<rect x="20" y="37" width="100" height="160" fill="none" stroke="#bc7755" stroke-width=".35" stroke-dasharray="2,2"/>
<text x="70" y="94" font-family="Arial" font-size="6" text-anchor="middle">CORPS 12 × 18 cm</text><text x="70" y="101" font-family="Arial" font-size="3.5" text-anchor="middle">Couper 2 extérieurs</text><text x="70" y="106" font-family="Arial" font-size="3.5" text-anchor="middle">+ 2 doublures</text><text x="70" y="111" font-family="Arial" font-size="3.5" text-anchor="middle">+ 2 soutiens coton fin</text>
<text x="70" y="187" font-family="Arial" font-size="3.3" fill="#bc7755" text-anchor="middle">Pointillés : couture à 1 cm</text>
<rect x="136" y="27" width="64" height="95" fill="#f2e5da" stroke="#af7657" stroke-width=".4"/>
<text x="168" y="39" text-anchor="middle" font-family="Arial" font-size="4.4" font-weight="bold">COULISSE</text>
<text x="168" y="46" text-anchor="middle" font-family="Arial" font-size="3.7">12 × 8 cm</text><text x="168" y="53" text-anchor="middle" font-family="Arial" font-size="3.7">Couper 2</text>
<text x="168" y="64" text-anchor="middle" font-family="Arial" font-size="3.2">Pièce à tracer :</text>
<text x="168" y="69" text-anchor="middle" font-family="Arial" font-size="3.2">12 cm de largeur,</text><text x="168" y="74" text-anchor="middle" font-family="Arial" font-size="3.2">8 cm de hauteur.</text>
<text x="168" y="85" text-anchor="middle" font-family="Arial" font-size="3.2">Replier les petits côtés</text><text x="168" y="90" text-anchor="middle" font-family="Arial" font-size="3.2">de 1 cm avant pliage.</text>
<text x="168" y="100" text-anchor="middle" font-family="Arial" font-size="3.2">Pas de gabarit ici :</text><text x="168" y="105" text-anchor="middle" font-family="Arial" font-size="3.2">la pièce est rectangulaire.</text>
<text x="136" y="135" font-family="Arial" font-size="3.6" font-weight="bold">Deux cordons</text><text x="136" y="141" font-family="Arial" font-size="3.5">de 55 cm chacun</text>
<rect x="145" y="158" width="50" height="50" stroke="#263c32" stroke-width=".5" fill="none"/>
<text x="170" y="214" font-size="3.2" font-family="Arial" text-anchor="middle">Carré témoin 5 × 5 cm</text>
<g font-family="Arial" font-size="3.6" fill="#263c32"><text x="10" y="224">Étui fini : environ 10 cm de large × 19 cm de haut.</text><text x="10" y="231">Coulisse : replier 1 cm les deux petits côtés, puis plier en deux en longueur.</text><text x="10" y="238">Vérifier le passage des lunettes avant la couture définitive.</text><text x="10" y="248">Le motif Fleur du Bengale est détaillé dans l’article Coutures du monde → Bengale.</text></g>

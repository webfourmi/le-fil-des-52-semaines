<text x="56" y="555" fill="#654b42" font-size="18">Tissu : laine fine historiquement ; grand drap souple pour un premier essai.</text>
<text x="56" y="580" fill="#654b42" font-size="18">Ne pas imprimer à l'échelle : reporter la courbe sur le tissu. Finir les bords si nécessaire.</text></svg>
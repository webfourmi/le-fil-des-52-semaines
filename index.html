let backupPending=null;
let exportBusy=false;
async function downloadBackup(){if(exportBusy)return;exportBusy=true;const button=el('backup-export');if(button){button.disabled=true;button.textContent='Préparation de la sauvegarde…'}try{
if(Fil52Backup.SCHEMA!==4)throw Error('Une mise à jour de l’application est nécessaire avant de sauvegarder les projets persos.');
const photos=await Fil52Gallery.list(state.profile);
const personalPhotos=await Fil52PersonalPhotos.list(state.profile);
const json=JSON.stringify(Fil52Backup.exportData(state,state.profile,photos,personalPhotos));
const url=URL.createObjectURL(new Blob([json],{type:'application/json;charset=utf-8'}));
const stamp=new Date().toISOString().replace(/[:.]/g,'-').replace('Z','Z');
const name=state.profile==='f'?'mathilde':'moi';
const a=document.createElement('a');a.href=url;a.download='fil52-'+name+'-'+stamp+'.json';
document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
toast('Sauvegarde créée : '+photos.length+' photo(s) des cours et '+personalPhotos.length+' photo(s) personnelles. Copie-la dans ton Google Drive.');
}catch(e){toast('Sauvegarde impossible : '+e.message)}
finally{exportBusy=false;if(button){button.disabled=false;button.textContent='Télécharger ma sauvegarde'}}}
async function prepareBackup(file){backupPending=null;const preview=el('backup-preview'),button=el('backup-restore');preview.hidden=false;button.disabled=true;preview.textContent='Lecture et contrôle du fichier…';if(!file){preview.textContent='Choisissez un fichier.';return}try{if(file.size>Fil52Backup.MAX_FILE_SIZE)throw Error('Fichier trop volumineux.');let parsed=Fil52Backup.parseBackup(await file.text());if(parsed.profile!==state.profile)throw Error('Cette sauvegarde ne correspond pas à '+state.names[state.profile]+'.');backupPending=parsed;preview.textContent='Sauvegarde du '+new Date(parsed.exportedAt).toLocaleDateString('fr-FR')+' · '+parsed.data.blocks.length+'/52 blocs, '+parsed.photos.length+' photos des cours'+(parsed.preservePersonal?' · Projets persos actuels conservés (ancien fichier).':' · '+parsed.data.personalProjects.length+' projets persos, '+parsed.personalPhotos.length+' photos personnelles.');button.disabled=false}catch(e){preview.textContent='Import refusé : '+e.message}}
async function restoreBackup(){
 if(!backupPending)return;
 if(!confirm('Restaurer ce carnet et ses photos ? Les données du profil seront remplacées, sauf les projets persos conservés lors de l’import d’une ancienne sauvegarde.'))return;
 const profile=state.profile,previous=state;
 let oldWeekly=null,oldPersonal=null,changedWeekly=false,changedPersonal=false;
 try{
   const next=Fil52Backup.applyBackup(state,backupPending,profile);
   oldWeekly=await Fil52Gallery.list(profile);
   oldPersonal=await Fil52PersonalPhotos.list(profile);
   if(!backupPending.preservePersonal){
     await Fil52PersonalPhotos.replace(profile,backupPending.personalPhotos,next.personalProjects[profile].map(p=>p.id));changedPersonal=true;
   }
   if(!backupPending.legacy){await Fil52Gallery.replace(profile,backupPending.photos);changedWeekly=true}
   try{localStorage.setItem('fil52.progress.v1',JSON.stringify({...next,page:'home'}))}
   catch(e){throw Error('Enregistrement du carnet impossible : '+e.message)}
   state=next;state.page='backup';backupPending=null;render();toast('Carnet et galeries restaurés.');
 }catch(e){
   state=previous;
   try{
     if(changedPersonal&&oldPersonal)await Fil52PersonalPhotos.replace(profile,oldPersonal,(previous.personalProjects?.[profile]||[]).map(p=>p.id));
     if(changedWeekly&&oldWeekly)await Fil52Gallery.replace(profile,oldWeekly);
   }catch(_){toast('Restauration interrompue : vérifie tes sauvegardes.');return}
   toast('Restauration impossible : '+e.message);
 }
}

async function renderPersonalPhotos(profile){
 const photos=await Fil52PersonalPhotos.list(profile).catch(e=>{toast('Photos personnelles : '+e.message);return null});
 if(!photos||profile!==state.profile||state.page!=='personal')return;
 for(const section of document.querySelectorAll('[data-personal-gallery]')){
  const projectId=section.dataset.personalGallery,items=photos.filter(x=>x.projectId===projectId);
  section.replaceChildren();
  if(!items.length){const empty=document.createElement('p');empty.className='personal-help';empty.textContent='Aucune photo pour le moment.';section.append(empty)}
  for(const item of items){
   const card=document.createElement('div');card.className='personal-thumb';
   const image=document.createElement('img');image.src=item.dataUrl;image.alt='Photographie personnelle de couture';image.loading='lazy';
   const del=document.createElement('button');del.className='secondary';del.type='button';del.textContent='Supprimer la photo';del.dataset.personalPhotoDelete=item.photoId;del.dataset.personalProjectId=item.projectId;
   card.append(image,del);section.append(card);
  }
  const upload=document.querySelector('[data-personal-upload="'+projectId+'"]');
  if(upload)upload.disabled=items.length>=Fil52PersonalPhotos.MAX_PER_PROJECT||photos.length>=Fil52PersonalPhotos.MAX_PHOTOS;
 }
}
function newPersonalProject(){
 const input=el('personal-new-name'),title=input?.value.trim(),profile=state.profile;
 if(!title){toast('Indique un nom pour ta création.');return}
 const projects=state.personalProjects[profile];
 if(projects.length>=40){toast('La limite de 40 projets personnels est atteinte.');return}
 projects.unshift({id:Fil52PersonalPhotos.newId(),title:title.slice(0,100),notes:'',createdAt:new Date().toISOString()});
 save();render();toast('Projet personnel créé.');
}
async function uploadPersonalPhotos(projectId,files){
 const profile=state.profile,projects=state.personalProjects[profile];if(!projects.some(p=>p.id===projectId))return;
 const list=Array.from(files||[]);if(!list.length)return;
 const input=document.querySelector('[data-personal-upload="'+projectId+'"]');if(input)input.disabled=true;
 let completed=0;
 try{
  for(const file of list){await Fil52PersonalPhotos.add(profile,projectId,file);completed++}
  toast(completed+' photo(s) ajoutée(s).');
 }catch(e){toast(completed+' photo(s) ajoutée(s). '+e.message)}
 finally{if(input)input.value='';if(profile===state.profile&&state.page==='personal')renderPersonalPhotos(profile)}
}
async function deletePersonalPhoto(projectId,photoId){
 if(!confirm('Supprimer cette photographie de ton projet personnel ?'))return;
 const profile=state.profile;
 try{await Fil52PersonalPhotos.remove(profile,projectId,photoId);await renderPersonalPhotos(profile);toast('Photo supprimée.')}catch(e){toast(e.message)}
}
async function deletePersonalProject(projectId){
 const profile=state.profile,projects=state.personalProjects[profile];if(!projects.some(x=>x.id===projectId))return;
 if(!confirm('Supprimer ce projet personnel et toutes ses photos ?'))return;
 try{
  const oldPhotos=await Fil52PersonalPhotos.list(profile);
  const remaining=projects.filter(x=>x.id!==projectId),keptPhotos=oldPhotos.filter(p=>p.projectId!==projectId);
  await Fil52PersonalPhotos.replace(profile,keptPhotos,remaining.map(x=>x.id));
  state.personalProjects[profile]=remaining;save();render();toast('Projet personnel supprimé.');
 }catch(e){toast('Suppression impossible : '+e.message)}
}
function journalPage(){let p=state.profile,w=state.week;let done=state.projectsDone[p].includes(w);return `<span class="eyebrow">Mes créations et mes souvenirs</span><h1>Mon journal de couture</h1><p class="lead">Un carnet personnel pour ${safe(state.names[p])}. Les cases et les notes ne concernent que tes créations.</p><div class="section card"><label for="journal-week"><b>Choisir une semaine</b></label><select class="selection" id="journal-week">${projects.map((x,i)=>`<option value="${i+1}" ${w===i+1?'selected':''}>N° ${i+1} · ${safe(x)}</option>`).join('')}</select><div class="section"><h3>N° ${w} · ${safe(projects[w-1])}</h3><label class="material"><input type="checkbox" data-journal-complete="${w}" ${done?'checked':''}> Projet couture terminé</label><label class="material"><input type="checkbox" data-journal-block="${w}" ${state.blocks[p].includes(w)?'checked':''}> Bloc de patchwork terminé</label><p class="small">Difficulté ressentie (facultatif)</p><select id="journal-rating" class="selection"><option value="">Non évaluée</option>${[1,2,3,4,5].map(v=>`<option value="${v}" ${state.ratings[p][w]===v?'selected':''}>${v} / 5</option>`).join('')}</select><h3 style="margin-top:20px">Mes notes</h3><textarea class="notes" data-note="${w}" placeholder="Tissus récupérés, réglages, difficultés, réussites, idées pour la prochaine fois...">${safe(state.notes[p][w]||'')}</textarea><p class="small">Notes et coches conservées sur ce navigateur.</p><div class="section"><h3>Ma galerie de la semaine</h3><p class="small">Une photo du projet et une du bloc patchwork (JPEG, PNG, WebP, maximum 12 Mo par photo avant réduction).</p><div id="journal-gallery" class="gallery-pair">Chargement des photos…</div></div><div class="actions"><button class="secondary" data-page="personal">✂ Mes projets persos ↗</button><button class="secondary" data-page="backup">Sauvegarder mon journal ↗</button></div></div></div>`}
function printPattern(name){let target=el('print-'+name);if(!target)return;target.classList.add('active');window.print();setTimeout(()=>target.classList.remove('active'),600)}
document.addEventListener('load',e=>{if(e.target instanceof HTMLImageElement&&e.target.closest('.photo-card'))e.target.classList.add('is-loaded');},true);
document.addEventListener('error',e=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.closest('.photo-card'))return;const wrap=document.createElement('div');wrap.className='photo-fallback';wrap.setAttribute('role','img');wrap.setAttribute('aria-label','Photo documentaire indisponible hors connexion ; ouvrez sa notice originale ci-dessous.');const mark=document.createElement('span');mark.textContent='▧';const label=document.createElement('small');label.textContent='Photographie documentaire à consulter sur la notice originale';wrap.append(mark,label);img.replaceWith(wrap);},true);
document.addEventListener('submit',e=>{if(e.target.id==='personal-new-form'){e.preventDefault();newPersonalProject()}});
document.addEventListener('click',e=>{
 if(e.target.closest('[data-personal-delete]')){deletePersonalProject(e.target.closest('[data-personal-delete]').dataset.personalDelete);return}
 if(e.target.closest('[data-personal-photo-delete]')){const b=e.target.closest('[data-personal-photo-delete]');deletePersonalPhoto(b.dataset.personalProjectId,b.dataset.personalPhotoDelete);return}
 if(e.target.closest('[data-gallery-delete]')){deleteGalleryPhoto(e.target.closest('[data-gallery-delete]').dataset.galleryDelete);return}if(e.target.closest('[data-identity]')){selectIdentity(e.target.closest('[data-identity]').dataset.identity);return}if(e.target.closest('#backup-export')){downloadBackup();return}if(e.target.closest('#backup-restore')){restoreBackup();return}if(e.target.closest('#backup-cancel')){backupPending=null;const f=el('backup-file');if(f)f.value='';el('backup-preview').hidden=true;el('backup-restore').disabled=true;return}let b=e.target.closest('[data-page],[data-week],[data-profile],[data-quilt-person],[data-print]');if(!b)return;if(b.dataset.page)page(b.dataset.page);else if(b.dataset.week)selectWeek(b.dataset.week);else if(b.dataset.profile)chooseProfile(b.dataset.profile);else if(b.dataset.quiltPerson){let p=b.dataset.quiltPerson,n=+b.dataset.quiltBlock;toggle('blocks',p,n);toast(`${state.blocks[p].includes(n)?'Bloc terminé':'Bloc décoché'} : n° ${n} · ${state.names[p]}`)}else if(b.dataset.print)printPattern(b.dataset.print)});
document.addEventListener('change',e=>{let a=e.target;
 if(a.dataset.personalUpload){uploadPersonalPhotos(a.dataset.personalUpload,a.files);return}
 if(a.dataset.personalTitle&&(!a.value.trim())){const item=state.personalProjects[state.profile].find(p=>p.id===a.dataset.personalTitle);if(item)a.value=item.title;toast('Un projet doit avoir un nom.');return}
 if(a.dataset.galleryUpload){addGalleryPhoto(a.dataset.galleryUpload,a.files?.[0]);return}if(a.id==='backup-file'){prepareBackup(a.files?.[0]);return}if(a.id==='week-select')selectWeek(a.value);else if(a.id==='journal-week'){state.week=+a.value;save();render()}else if(a.id==='journal-rating'){if(a.value)state.ratings[state.profile][state.week]=+a.value;else delete state.ratings[state.profile][state.week];save()}else if(a.dataset.journalComplete){toggle('projectsDone',state.profile,+a.dataset.journalComplete)}else if(a.dataset.journalBlock){toggle('blocks',state.profile,+a.dataset.journalBlock)}else if(a.dataset.toggle){toggle(a.dataset.toggle,state.profile,+a.dataset.val)}});
document.addEventListener('input',e=>{const a=e.target;
 if(a.dataset.personalTitle){const item=state.personalProjects[state.profile].find(p=>p.id===a.dataset.personalTitle);if(item&&a.value.trim()){item.title=a.value.trim().slice(0,100);save()}return}
 if(a.dataset.personalNotes){const item=state.personalProjects[state.profile].find(p=>p.id===a.dataset.personalNotes);if(item){item.notes=a.value.slice(0,5000);save()}return}
 if(a.dataset.note){state.notes[state.profile][+a.dataset.note]=a.value;save()}
});
window.Fil52OpenEdition=(d,week)=>{if(!Array.isArray(d.published)||!d.published.includes(week))return;upcomingEditions=d.issues||{};state.published=[...new Set([1,...d.published])];state.edition=String(d.version||'0.1');selectWeek(week);};
if(location.protocol.startsWith('http'))fetch('./data/editions.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(Array.isArray(d.published)&&d.published.every(n=>Number.isInteger(n)&&n>=1&&n<=52)){const incoming=[...new Set([1,...d.published])];const nextVersion=String(d.version||'0.1');const changed=state.edition!==nextVersion||incoming.length!==state.published.length||incoming.some(n=>!state.published.includes(n));upcomingEditions=d.issues||{};state.published=incoming;state.edition=nextVersion;if((changed||(state.page==='learn'&&state.week>1&&!!upcomingEditions[state.week]))&&!document.activeElement?.matches('textarea[data-note],textarea[data-personal-notes],input[data-personal-title],#personal-new-name'))render();}}).catch(()=>{});
render();
</script>
</body>

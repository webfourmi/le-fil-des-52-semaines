name: V1.1.2 - Histoire de la couture 01
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fil52-http.log 2>&1 &
          sleep 2
      - run: node tests/couture-history-01.cjs
      - run: node tests/aesthetic-icons.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: histoire-couture-01-apercus
          path: tests/screenshots/histoire-couture-01-*.png
          if-no-files-found: ignore
          retention-days: 21

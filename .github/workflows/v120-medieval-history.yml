name: Histoire couture 03 - Moyen Age et aumoniere
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  medieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/history-medieval.js
      - run: node --check assets/aumoniere-medievale.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fil52-http.log 2>&1 &
          sleep 2
      - run: node tests/couture-history-03.cjs

name: V1.1.13 - Journal à trois rubriques et albums photo
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fil52-http.log 2>&1 &
          sleep 2
      - run: node tests/v118-halloween-editorial.cjs
      - run: node tests/v119-patrons-arrondis.cjs
      - run: node tests/v1110-search-patrons.cjs
      - run: node tests/v1113-journal-albums.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v119-apercus
          path: tests/screenshots/v11[89]-*.png
          if-no-files-found: ignore
          retention-days: 21

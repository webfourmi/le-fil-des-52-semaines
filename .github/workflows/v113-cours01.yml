name: V1.1.3 - Marque-page H630 et Dico couture
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course01:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fil52-http.log 2>&1 &
          sleep 2
      - run: node tests/cours01-h630-dico.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cours01-h630-dico-apercus
          path: tests/screenshots/cours01-h630-*.png
          if-no-files-found: ignore
          retention-days: 21

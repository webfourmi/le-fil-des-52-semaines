name: V0.5 - PWA browser checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - run: node tests/pwa-smoke.cjs
      - run: node tests/pwa-update.cjs
      - run: node tests/pwa-offline-album.cjs
